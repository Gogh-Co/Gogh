color_07: '#2C9370'    # Cyan (Prompt)
color_08: '#B0B6BA'    # White

color_09: '#212C3C'    # Bright Black
color_10: '#D4312E'    # Bright Red (Command error)
color_11: '#2D9440'    # Bright Green (Exec)
color_12: '#E5BE0C'    # Bright Yellow
color_13: '#3C7DD2'    # Bright Blue (Folder)
