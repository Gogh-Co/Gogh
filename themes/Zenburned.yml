---
name: 'Zenburned'
author: 'Zenburn (http://sunaku.github.io/zenburn-terminal-color-scheme.html)'
variant: 'dark'            # dark or light

color_01: '#404040'    # Black (Host)
color_02: '#E3716E'    # Red (Syntax string)
color_03: '#819B69'    # Green (Command)
color_04: '#B77E64'    # Yellow (Command second)
color_05: '#6099C0'    # Blue (Path)
color_06: '#B279A7'    # Magenta (Syntax var)
color_07: '#66A5AD'    # Cyan (Prompt)
color_08: '#F0E4CF'    # White

color_09: '#625A5B'    # Bright Black
color_10: '#EC8685'    # Bright Red (Command error)
color_11: '#8BAE68'    # Bright Green (Exec)
color_12: '#D68C67'    # Bright Yellow
color_13: '#61ABDA'    # Bright Blue (Folder)
color_14: '#CF86C1'    # Bright Magenta
color_15: '#65B8C1'    # Bright Cyan
color_16: '#C0AB86'    # Bright White

background: '#404040'  # Background
foreground: '#F0E4CF'  # Foreground (Text)

cursor: '#F3EADB'      # Cursor
