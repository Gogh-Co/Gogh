author_name: 'Bram de Haan'
author_url: 'http://atelierbram.github.io/syntax-highlighting/atelier-schemes/sulphurpool'
variant: 'dark'            # dark or light

color_01: '#202746'    # Black (Host)
color_02: '#C94922'    # Red (Syntax string)
