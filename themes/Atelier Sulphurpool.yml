color_04: '#C08B30'    # Yellow (Command second)
color_05: '#3D8FD1'    # Blue (Path)
color_06: '#6679CC'    # Magenta (Syntax var)
color_07: '#22A2C9'    # Cyan (Prompt)
color_08: '#979DB4'    # White

color_09: '#6B7394'    # Bright Black
color_10: '#C76B29'    # Bright Red (Command error)
color_11: '#293256'    # Bright Green (Exec)
color_12: '#5E6687'    # Bright Yellow
color_13: '#898EA4'    # Bright Blue (Folder)
color_14: '#DFE2F1'    # Bright Magenta
color_15: '#9C637A'    # Bright Cyan
color_16: '#F5F7FF'    # Bright White

background: '#202746'  # Background
foreground: '#979DB4'  # Foreground (Text)

