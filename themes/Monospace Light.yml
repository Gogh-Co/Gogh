color_08: '#5D6A7D'    # White

color_09: '#000000'    # Bright Black
color_10: '#A52430'    # Bright Red (Command error)
color_11: '#00522F'    # Bright Green (Exec)
color_12: '#904B1A'    # Bright Yellow
color_13: '#002487'    # Bright Blue (Folder)
color_14: '#4D21BB'    # Bright Magenta
color_15: '#00607E'    # Bright Cyan
color_16: '#475365'    # Bright White

background: '#F4F7FD'  # Background
