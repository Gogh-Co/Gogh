---
name: 'Nvim Light'
author: 'slavamak (https://github.com/slavamak)'
variant: 'light'            # dark or light

color_01: '#07080D'    # Black (Host)
color_02: '#590008'    # Red (Syntax string)
color_03: '#005523'    # Green (Command)
color_04: '#6B5300'    # Yellow (Command second)
color_05: '#004C73'    # Blue (Path)
color_06: '#470045'    # Magenta (Syntax var)
color_07: '#007373'    # Cyan (Prompt)
color_08: '#EEF1F8'    # White

color_09: '#4F5258'    # Bright Black
color_10: '#590008'    # Bright Red (Command error)
color_11: '#005523'    # Bright Green (Exec)
color_12: '#6B5300'    # Bright Yellow
color_13: '#004C73'    # Bright Blue (Folder)
color_14: '#470045'    # Bright Magenta
color_15: '#007373'    # Bright Cyan
color_16: '#EEF1F8'    # Bright White

background: '#E0E2EA'  # Background
foreground: '#14161B'  # Foreground (Text)

cursor: '#9B9EA4'      # Cursor
