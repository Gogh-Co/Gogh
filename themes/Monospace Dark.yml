color_10: '#FC8F8E'    # Bright Red (Command error)
color_11: '#66CE98'    # Bright Green (Exec)
color_12: '#FFC26E'    # Bright Yellow
color_13: '#A2B6FF'    # Bright Blue (Folder)
color_14: '#C8AAFF'    # Bright Magenta
color_15: '#71C2EE'    # Bright Cyan
color_16: '#FAFBFE'    # Bright White

