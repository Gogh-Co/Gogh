---
name: 'Monokai SublimeText'
author: 'Howar31 (https://github.com/howar31/monokai-sublimetext)'
variant: 'dark'            # dark or light

color_01: '#333333'    # Black (Host)
color_02: '#C4265E'    # Red (Syntax string)
color_03: '#86B42B'    # Green (Command)
color_04: '#B3B42B'    # Yellow (Command second)
color_05: '#6A7EC8'    # Blue (Path)
color_06: '#8C6BC8'    # Magenta (Syntax var)
color_07: '#56ADBC'    # Cyan (Prompt)
color_08: '#E3E3DD'    # White

color_09: '#666666'    # Bright Black
color_10: '#F92672'    # Bright Red (Command error)
color_11: '#A6E22E'    # Bright Green (Exec)
color_12: '#E2E22E'    # Bright Yellow
color_13: '#819AFF'    # Bright Blue (Folder)
color_14: '#AE81FF'    # Bright Magenta
color_15: '#66D9EF'    # Bright Cyan
color_16: '#F8F8F2'    # Bright White

background: '#272822'  # Background
foreground: '#F8F8F2'  # Foreground (Text)

cursor: '#F8F8F0'      # Cursor
