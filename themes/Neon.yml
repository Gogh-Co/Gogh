color_08: '#C7C7C7'    # White

color_09: '#686868'    # Bright Black
color_10: '#FF5A5A'    # Bright Red (Command error)
color_11: '#75FF88'    # Bright Green (Exec)
color_12: '#FFFD96'    # Bright Yellow
color_13: '#3C40CB'    # Bright Blue (Folder)
color_14: '#F15BE5'    # Bright Magenta
