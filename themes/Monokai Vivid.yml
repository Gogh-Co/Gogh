color_08: '#FFFFFF'    # White

color_09: '#838383'    # Bright Black
color_10: '#F6669D'    # Bright Red (Command error)
color_11: '#B1E05F'    # Bright Green (Exec)
color_12: '#FFF26D'    # Bright Yellow
color_13: '#0443FF'    # Bright Blue (Folder)
color_14: '#F200F6'    # Bright Magenta
color_15: '#51CEFF'    # Bright Cyan
color_16: '#FFFFFF'    # Bright White

