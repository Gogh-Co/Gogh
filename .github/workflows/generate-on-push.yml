# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "🛠️ - Run Generators"

on:
  workflow_dispatch:
  push:
    branches: ['master']
    paths:
      - 'themes/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 🏅 Checkout code
        uses: actions/checkout@v7

      - name: 🏅 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: 🏅 Install Python dependencies
        run: pip install -r requirements.txt --root-user-action=ignore

      - name: 🏅 Generate themes JSON
        run: python tools/generate/01_generate_themes_json.py

      - name: 🏅 Generate JSON files
        run: python tools/generate/02_split_themes_json.py

      - name: 🏅 Generate TXT files
        run: python tools/generate/03_split_themes_txt.py

      - name: 🏅 Generate CSV
        run: python tools/generate/04_generate_themes_csv.py

      - name: 🏅 Generate YAML
        run: python tools/generate/05_generate_themes_yaml.py

      - name: 🏅 Generate YAML files
        run: python tools/generate/06_split_themes_yaml.py

      - name: 🏅 Generate Installers
        run: python tools/generate/07_generate_install_scripts.py

      - name: 🏅 Update themes in Gogh file
        run: python tools/generate/08_update_gogh_sh_theme_list.py

      - name: 🏅 Pipeline run date
        run: python tools/generate/09_write_run_timestamp.py

      - name: 🏅 Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 🏅 Run WCAG generator script with Deno
        run: deno run --allow-all tools/generate/10_generate_wcag_report.js

      - name: 🏅 Count total files in 'themes' directory
        id: count_files
        run: |
          total_files=$(find themes -type f | wc -l)
          echo "total_files=$total_files" >> $GITHUB_ENV

      - name: 🏅 Check if release tag already exists
        run: |
          tag_name="v${{ env.total_files }}"
          if git ls-remote --tags origin "refs/tags/${tag_name}" | grep -q "${tag_name}"; then
            echo "tag_exists=true" >> $GITHUB_ENV
          else
            echo "tag_exists=false" >> $GITHUB_ENV
          fi

      # Same release actions/create-release@v1 made (archived, and stuck on
      # Node 12): tag the commit that triggered this run.
      - name: 🏅 Create Release
        if: env.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOTAL_FILES: ${{ env.total_files }}
        run: |
          gh release create "v${TOTAL_FILES}" \
            --target "${GITHUB_SHA}" \
            --title "Themes ${TOTAL_FILES}" \
            --notes "Release with ${TOTAL_FILES} files in the 'themes' directory."

      - name: 🏅 Commit and push changes
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@github.com
          TRIGGER_MESSAGE: ${{ github.event.head_commit.message || 'manual workflow run' }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@github.com
          git add .
          SUBJECT=$(printf '%s\n' "$TRIGGER_MESSAGE" | head -n1)
          git commit -m "chore(data) 🤖 : regenerate for \"${SUBJECT}\"" -m "Source commit: ${TRIGGER_SHA:0:7}"
          git push