# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "✅ - Validate PR"

on:
  pull_request:
    paths:
      - 'themes/**'
      # also catch a PR that touches CI-generated output directly, without
      # touching themes/** at all -- the scope check below rejects that.
      # Safe from the bot's own regenerate-and-push commit: generate-on-push.yml
      # only runs on pushes to master, never on an open PR's branch.
      - 'data/**'
      - 'installs/**'
      - 'gogh.sh'
      - 'tools/run.txt'

jobs:
  validate-colors:
    runs-on: ubuntu-22.04
    steps:
      - name: 🏅 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏅 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 🏅 Install Python dependencies
        run: pip install -r requirements.txt --root-user-action=ignore

      - name: 🏅 Validate color values are uppercase
        run: python tools/validate/validate_colors.py

      - name: 🏅 Validate theme name, filename, and contrast (new themes only)
        run: python tools/validate/validate_theme_format.py "${{ github.event.pull_request.base.sha }}"

      - name: 🏅 List changed files
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          cat /tmp/changed_files.txt

      - name: 🏅 Validate PR title and scope (themes/ only)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python tools/validate/validate_pr.py /tmp/changed_files.txt

  shell-validation:
    runs-on: ubuntu-22.04
    steps:
      - name: 🏅 Checkout code
        uses: actions/checkout@v4

      - name: 🏅 bash -n syntax check
        run: |
          bash -n gogh.sh
          bash -n apply-colors.sh
          for f in installs/*.sh; do bash -n "$f"; done

      # ubuntu-22.04 GitHub-hosted runners ship shellcheck preinstalled
      # (see actions/runner-images), so no separate install step is needed here.
      #
      # --severity=error is the widest scope that is currently clean against
      # gogh.sh and apply-colors.sh (verified locally with shellcheck 0.11.0).
      # Everything above "error" (the "warning"/"info"/"style" findings, e.g.
      # SC2086/SC2046/SC2207/SC2155/SC2034/SC2059/SC2223/SC2129/SC2005/SC2154/
      # SC2188/SC2269) is pre-existing quoting/style debt unrelated to this
      # branch's scope (CI/test infra only) -- left for a human to triage in a
      # follow-up, and still visible (never hidden) via the informational
      # report step below.
      - name: 🏅 ShellCheck (errors only, blocking)
        run: shellcheck --severity=error gogh.sh apply-colors.sh

      - name: 🏅 ShellCheck (full report, informational)
        run: shellcheck gogh.sh apply-colors.sh || true

      - name: 🏅 Install Bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: 🏅 Run Bats tests
        run: bats tests/
