# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "✅ - Validate PR"

on:
  pull_request:
    paths:
      - 'themes/**'
      # also catch a PR that touches CI-generated output directly, without
      # touching themes/** at all -- the scope check below rejects that.
      # Safe from the bot's own regenerate-and-push commit: generate-on-push.yml
      # only runs on pushes to master, never on an open PR's branch.
      - 'data/**'
      - 'installs/**'
      - 'gogh.sh'
      - 'tools/run.txt'

env:
  # Pinned for reproducible results; bump this deliberately, not implicitly.
  SHELLCHECK_VERSION: v0.11.0

jobs:
  validate-colors:
    runs-on: ubuntu-22.04
    steps:
      - name: 🏅 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏅 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 🏅 Install Python dependencies
        run: pip install -r requirements.txt --root-user-action=ignore

      - name: 🏅 Validate color values are uppercase
        run: python tools/validate/validate_colors.py

      - name: 🏅 Validate theme name, filename, and contrast (new themes only)
        run: python tools/validate/validate_theme_format.py "${{ github.event.pull_request.base.sha }}"

      - name: 🏅 List changed files
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          cat /tmp/changed_files.txt

      - name: 🏅 Validate PR title and scope (themes/ only)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python tools/validate/validate_pr.py /tmp/changed_files.txt

  shell-validation:
    runs-on: ubuntu-22.04
    steps:
      - name: 🏅 Checkout code
        uses: actions/checkout@v4

      - name: 🏅 bash -n syntax check
        run: |
          bash -n gogh.sh
          bash -n apply-colors.sh
          for f in installs/*.sh; do bash -n "$f"; done

      # Install the pinned version directly -- don't rely on the runner's
      # preinstalled ShellCheck, since different versions can flag different things.
      - name: 🏅 Install ShellCheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: 🏅 ShellCheck
        run: shellcheck gogh.sh apply-colors.sh

      - name: 🏅 Install Bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: 🏅 Run Bats tests
        run: bats tests/
