# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "✅ - Validate PR"

on:
  pull_request:
    paths:
      - 'themes/**'
      # also catch a PR that touches CI-generated output directly, without
      # touching themes/** at all -- the scope check below rejects that.
      # Safe from the bot's own regenerate-and-push commit: generate-on-push.yml
      # only runs on pushes to master, never on an open PR's branch.
      - 'data/**'
      - 'installs/**'
      - 'gogh.sh'
      - 'tools/run.txt'

jobs:
  validate-colors:
    runs-on: ubuntu-22.04
    steps:
      - name: 🏅 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏅 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 🏅 Install Python dependencies
        run: pip install -r requirements.txt --root-user-action=ignore

      - name: 🏅 Validate color values are uppercase
        run: python tools/validate/validate_colors.py

      - name: 🏅 Validate theme name, filename, and contrast (new themes only)
        run: python tools/validate/validate_theme_format.py "${{ github.event.pull_request.base.sha }}"

      - name: 🏅 List changed files
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          cat /tmp/changed_files.txt

      - name: 🏅 Validate PR title and scope (themes/ only)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python tools/validate/validate_pr.py /tmp/changed_files.txt
