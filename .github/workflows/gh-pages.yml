# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "🚀 - Deploy to GitHub Pages (branch website)"

on:
  workflow_dispatch:
  release:
    types: [published]
  workflow_run:
    workflows: ["🛠️ - Run Generators"]
    types: [completed]
  workflow_call:
    # Lets a tiny push-triggered stub workflow on main/website (which can't
    # carry a push trigger for that branch here, since GitHub only reads
    # workflow files from the ref that received the push) call this one by
    # reference instead of duplicating it. See
    # main/website:.github/workflows/deploy-on-push.yml.

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website branch
        uses: actions/checkout@v6
        with:
          ref: main/website

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install
      - run: npm run generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public


  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github_pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
