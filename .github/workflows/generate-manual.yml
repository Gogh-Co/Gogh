# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "🛠️ - Run Generators Manually"

on:
  workflow_dispatch:

concurrency:
  group: action-generator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 🏅 Checkout code
        uses: actions/checkout@v4

      - name: 🏅 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 🏅 Install Python dependencies
        run: python -m pip install -r requirements.txt --root-user-action=ignore

      - name: 🏅 Generate themes JSON
        run: python tools/generate/01_generate_themes_json.py

      - name: 🏅 Generate JSON files
        run: python tools/generate/02_split_themes_json.py

      - name: 🏅 Generate TXT files
        run: python tools/generate/03_split_themes_txt.py

      - name: 🏅 Generate CSV
        run: python tools/generate/04_generate_themes_csv.py

      - name: 🏅 Generate YAML
        run: python tools/generate/05_generate_themes_yaml.py

      - name: 🏅 Generate YAML files
        run: python tools/generate/06_split_themes_yaml.py

      - name: 🏅 Generate installers
        run: python tools/generate/07_generate_install_scripts.py

      - name: 🏅 Update themes in Gogh file
        run: python tools/generate/08_update_gogh_sh_theme_list.py

      - name: 🏅 Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 🏅 Generate WCAG reports
        run: deno run --allow-all tools/generate/10_generate_wcag_report.js
