---
version: '3'

vars:
  BASE: '{{.BASE | default "origin/master"}}'
  TITLE: '{{.TITLE | default "theme: local check"}}'

tasks:
  colors:
    desc: Check every theme's hex colors are uppercase (same check as CI).
    cmds:
      - uv run --with-requirements requirements.txt tools/validate/validate_colors.py

  format:
    desc: 'Check filename/name/contrast for themes changed vs. a base ref (default origin/master), same check as CI. Override with BASE=<ref>.'
    vars:
      # distinct `sh:` command from validate:pr's on purpose -- format and pr
      # run concurrently as deps of `validate`, and Task caches identical
      # `sh:` commands, so an identical "mktemp" here would hand both tasks
      # the same temp file and race on it.
      CHANGED_FILES:
        sh: mktemp -t gogh-validate-format-XXXXXX
    cmds:
      - git diff --name-only {{.BASE}}...HEAD > {{.CHANGED_FILES}}
      - defer: rm -f {{.CHANGED_FILES}}
      - uv run --with-requirements requirements.txt tools/validate/validate_theme_format.py {{.CHANGED_FILES}}

  pr:
    desc: 'Check PR title/scope vs. a base ref (default origin/master), same check as CI. Override with BASE=<ref> TITLE="theme: ..."'
    vars:
      CHANGED_FILES:
        sh: mktemp -t gogh-validate-pr-XXXXXX
    cmds:
      - git diff --name-only {{.BASE}}...HEAD > {{.CHANGED_FILES}}
      - defer: rm -f {{.CHANGED_FILES}}
      - PR_TITLE="{{.TITLE}}" uv run tools/validate/validate_pr.py {{.CHANGED_FILES}}
